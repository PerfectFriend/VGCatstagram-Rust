[package]
name = "vangoghcat-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Axum REST API server and WebSocket signaling relay for VanGoghCat"

[dependencies]
vangoghcat-core = { path = "../core" }
vangoghcat-crypto = { path = "../crypto" }
vangoghcat-storage = { path = "../storage" }
vangoghcat-p2p = { path = "../p2p" }
axum = { workspace = true, features = ["ws"] }
tower-http = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
