[package]
name = "vangoghcat-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "WebAssembly bindings for VanGoghCat cryptography and proof verification"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vangoghcat-core = { path = "../core" }
vangoghcat-crypto = { path = "../crypto" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { workspace = true }
serde-wasm-bindgen = "0.6"
hex = { workspace = true }
